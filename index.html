<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClickDPS - An addictive clicker game. Build combos, land critical hits, and chase your highest damage per second score." />
    <meta property="og:title" content="ClickDPS - Click to Destroy" />
    <meta property="og:description" content="An addictive clicker game. Build combos, land critical hits, and chase your highest DPS score." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23000' width='100' height='100'/%3E%3Ctext x='50' y='50' text-anchor='middle' dominant-baseline='central' font-family='monospace' font-weight='900' font-size='60' fill='%23fff'%3EDPS%3C/text%3E%3Crect x='5' y='5' width='20' height='20' fill='none' stroke='%23ff0040' stroke-width='4'/%3E%3Crect x='75' y='75' width='20' height='20' fill='none' stroke='%2300ff88' stroke-width='4'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=VT323&family=Playfair+Display:wght@700;900&family=Space+Mono:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <title>CLICKDPS</title>
    <style>
      /* ==========================================
         THEME: CYBER - Sleek cyberpunk, techy
         ========================================== */
      :root, [data-theme="cyber"] {
        --spacing: 16px;
        --spacing-sm: 8px;
        --color-bg: #0a0a12;
        --color-text: #ffffff;
        --color-accent: #ff0080;
        --color-success: #00ffff;
        --color-muted: #8888aa;
        --color-subtle: #3a3a5a;
        --color-border: #2a2a4a;
        --color-grid: #15152a;
        --color-glow: rgba(255, 0, 128, 0.5);
        --font-main: 'Orbitron', sans-serif;
        --font-body: 'Space Mono', monospace;
        --border-style: 2px solid;
        --corner-size: 30px;
        --grid-size: 40px;
        --grid-style: linear-gradient(var(--color-grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
      }

      /* ==========================================
         THEME: ARCADE - Retro 8-bit pixel style
         ========================================== */
      [data-theme="arcade"] {
        --color-bg: #1a1a2e;
        --color-text: #eeff00;
        --color-accent: #ff0055;
        --color-success: #00ff88;
        --color-muted: #aa88ff;
        --color-subtle: #4a4a6e;
        --color-border: #3a3a5e;
        --color-grid: #22223a;
        --color-glow: rgba(255, 0, 85, 0.6);
        --font-main: 'VT323', monospace;
        --font-body: 'VT323', monospace;
        --border-style: 4px solid;
        --corner-size: 20px;
        --grid-size: 32px;
        --grid-style:
          linear-gradient(var(--color-grid) 2px, transparent 2px),
          linear-gradient(90deg, var(--color-grid) 2px, transparent 2px);
      }

      /* ==========================================
         THEME: SYNTH - 80s outrun, sunset vibes
         ========================================== */
      [data-theme="synth"] {
        --color-bg: #0f0a1e;
        --color-text: #fff;
        --color-accent: #ff2975;
        --color-success: #f6d365;
        --color-muted: #c56cf0;
        --color-subtle: #5a3d7a;
        --color-border: #3d2a5a;
        --color-grid: #1a1030;
        --color-glow: rgba(255, 41, 117, 0.5);
        --font-main: 'Orbitron', sans-serif;
        --font-body: 'Space Mono', monospace;
        --border-style: 2px solid;
        --corner-size: 25px;
        --grid-size: 60px;
        --grid-style:
          linear-gradient(transparent 0%, transparent 49%, var(--color-grid) 50%, transparent 51%, transparent 100%),
          linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
      }

      /* ==========================================
         THEME: BLOOM - Cute, soft, floral
         ========================================== */
      [data-theme="bloom"] {
        --color-bg: #fff5f8;
        --color-text: #5c4a5e;
        --color-accent: #ff6b9d;
        --color-success: #7ed99f;
        --color-muted: #c9a0b5;
        --color-subtle: #e8c8d8;
        --color-border: #f0d0e0;
        --color-grid: #ffe8ef;
        --color-glow: rgba(255, 107, 157, 0.4);
        --font-main: 'Quicksand', 'Comic Sans MS', cursive;
        --font-body: 'Quicksand', 'Comic Sans MS', cursive;
        --border-style: 3px solid;
        --corner-size: 20px;
        --grid-size: 50px;
        --grid-style:
          radial-gradient(circle, var(--color-grid) 1px, transparent 1px);
      }

      /* ==========================================
         THEME: BRUTAL - Raw, industrial, bold
         ========================================== */
      [data-theme="brutal"] {
        --color-bg: #ffffff;
        --color-text: #000000;
        --color-accent: #ff0000;
        --color-success: #000000;
        --color-muted: #555555;
        --color-subtle: #aaaaaa;
        --color-border: #000000;
        --color-grid: #f0f0f0;
        --color-glow: rgba(255, 0, 0, 0.3);
        --font-main: 'Arial Black', 'Impact', sans-serif;
        --font-body: 'Arial', sans-serif;
        --border-style: 4px solid;
        --corner-size: 0px;
        --grid-size: 50px;
        --grid-style:
          linear-gradient(var(--color-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        cursor: crosshair;
        user-select: none;
        position: fixed;
        width: 100%;
        transition: background-color 0.3s, color 0.3s;
      }

      /* Screen shake container */
      #shake-container {
        position: fixed;
        inset: 0;
        transition: transform 0.05s ease-out;
        contain: layout style;
        will-change: transform;
      }

      /* Grid background */
      #grid-bg {
        position: fixed;
        inset: 0;
        background-image: var(--grid-style);
        background-size: var(--grid-size) var(--grid-size);
        opacity: 0.5;
        pointer-events: none;
        transition: opacity 0.1s, transform 0.3s;
      }

      /* Intensity glow overlay */
      #intensity-glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 50% 50%, var(--color-glow) 0%, transparent 70%);
        transition: opacity 0.2s;
        z-index: 5;
      }

      /* Edge glow for milestones */
      #edge-glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 100px var(--color-accent);
        z-index: 6;
      }

      #edge-glow.pulse {
        animation: edge-pulse 0.8s ease-out;
      }

      @keyframes edge-pulse {
        0% { opacity: 0.8; }
        100% { opacity: 0; }
      }

      #hud {
        position: fixed;
        top: var(--spacing);
        left: var(--spacing);
        z-index: 100;
        mix-blend-mode: difference;
      }

      #dps-num {
        font-family: var(--font-main);
        font-size: clamp(64px, 20vw, 200px);
        font-weight: 900;
        line-height: 0.8;
        letter-spacing: -0.02em;
        color: var(--color-text);
        text-shadow:
          4px 4px 0 var(--color-accent),
          -2px -2px 0 var(--color-success);
        transition: transform 0.1s ease-out, text-shadow 0.3s, font-family 0.3s;
      }

      #dps-num.pulse {
        animation: dps-pulse 0.2s ease-out;
      }

      @keyframes dps-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      #dps-num.big-pulse {
        animation: dps-big-pulse 0.4s ease-out;
      }

      @keyframes dps-big-pulse {
        0% { transform: scale(1); }
        30% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }

      #label {
        font-size: 10px;
        letter-spacing: 0.4em;
        color: var(--color-subtle);
        text-transform: uppercase;
        margin-top: var(--spacing-sm);
      }

      #combo {
        display: inline-block;
        font-size: clamp(18px, 5vw, 32px);
        font-weight: 900;
        color: var(--color-accent);
        opacity: 0;
        transition: opacity 0.1s, transform 0.1s;
        margin-left: 12px;
        vertical-align: bottom;
      }

      #best {
        position: fixed;
        top: var(--spacing);
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
      }

      #best-label {
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--color-subtle);
        text-transform: uppercase;
      }

      #best-value {
        font-size: 22px;
        font-weight: 900;
        color: var(--color-success);
        letter-spacing: -0.02em;
      }

      #new-best {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        letter-spacing: 0.3em;
        color: var(--color-success);
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        z-index: 60;
      }

      #new-best.show {
        animation: new-best-anim 1.5s ease-out forwards;
      }

      @keyframes new-best-anim {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -80%) scale(1.2); }
      }

      #combo.visible {
        opacity: 1;
      }

      /* Milestone notification */
      #milestone {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: var(--color-accent);
        text-shadow: 0 0 30px var(--color-accent);
        opacity: 0;
        pointer-events: none;
        z-index: 61;
      }

      #milestone.show {
        animation: milestone-anim 1s ease-out forwards;
      }

      @keyframes milestone-anim {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
      }

      #bar-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 200;
      }

      #bar-label {
        position: absolute;
        bottom: 6px;
        left: var(--spacing);
        font-size: 8px;
        letter-spacing: 0.15em;
        color: var(--color-muted);
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.2s;
      }

      #bar-container:hover #bar-label {
        opacity: 1;
      }

      #bar {
        width: 100%;
        height: 4px;
        background: var(--color-grid);
      }

      #bar-fill {
        height: 100%;
        width: 0%;
        background: var(--color-text);
        transition: width 0.05s linear, background-color 0.3s;
      }

      #stats {
        position: fixed;
        top: var(--spacing);
        right: var(--spacing);
        text-align: right;
        font-size: 14px;
        line-height: 1.9;
        color: var(--color-muted);
        z-index: 100;
      }

      #stats span {
        color: #888;
      }

      /* Damage popups */
      .hit {
        position: absolute;
        font-weight: 900;
        pointer-events: none;
        z-index: 60;
        animation: pop 0.5s ease-out forwards;
        will-change: transform, opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      .hit.norm {
        font-size: 28px;
        color: var(--color-text);
      }

      .hit.crit {
        font-size: 48px;
        color: var(--color-accent);
        text-shadow: 0 0 20px var(--color-accent);
        animation: pop-crit 0.7s ease-out forwards;
      }

      @keyframes pop {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-60px) scale(0.7);
        }
      }

      @keyframes pop-crit {
        0% {
          opacity: 1;
          transform: translateY(0) scale(0.5) rotate(-5deg);
        }
        20% {
          transform: translateY(-10px) scale(1.3) rotate(5deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-100px) scale(0.8) rotate(-3deg);
        }
      }

      /* Impact ring */
      .ring {
        position: absolute;
        width: 80px;
        height: 80px;
        border: 2px solid var(--color-text);
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0) translateZ(0);
        animation: ring-out 0.3s ease-out forwards;
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      @keyframes ring-out {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0.6;
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }
      }

      /* Particle effects */
      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--color-accent);
        border-radius: 50%;
        pointer-events: none;
        z-index: 55;
        will-change: transform, opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Cursor trail */
      .trail {
        position: absolute;
        width: 6px;
        height: 6px;
        background: var(--color-text);
        border-radius: 50%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.6;
        will-change: transform, opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Crit flash */
      #flash {
        position: fixed;
        inset: 0;
        background: var(--color-accent);
        opacity: 0;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: overlay;
      }

      #flash.on {
        animation: flash 0.08s ease-out;
      }

      @keyframes flash {
        0% { opacity: 0.4; }
        100% { opacity: 0; }
      }

      /* Corner decorations */
      .corner {
        position: fixed;
        width: var(--corner-size);
        height: var(--corner-size);
        border: var(--border-style) var(--color-border);
        pointer-events: none;
        z-index: 10;
        transition: border-color 0.3s, width 0.3s, height 0.3s;
      }
      .corner.tl { top: var(--spacing-sm); left: var(--spacing-sm); border-right: none; border-bottom: none; }
      .corner.tr { top: var(--spacing-sm); right: var(--spacing-sm); border-left: none; border-bottom: none; }
      .corner.bl { bottom: var(--spacing-sm); left: var(--spacing-sm); border-right: none; border-top: none; }
      .corner.br { bottom: var(--spacing-sm); right: var(--spacing-sm); border-left: none; border-top: none; }

      #hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--color-muted);
        text-transform: uppercase;
        transition: opacity 0.5s ease-out;
      }

      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .bottom-btn {
        position: fixed;
        bottom: var(--spacing);
        font-family: var(--font-body);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--color-muted);
        background: none;
        border: var(--border-style) var(--color-border);
        padding: 12px 16px;
        cursor: pointer;
        text-transform: uppercase;
        z-index: 100;
        transition: color 0.1s, border-color 0.1s, transform 0.05s;
        min-height: 44px;
        min-width: 44px;
      }

      .bottom-btn:hover {
        color: #888;
        border-color: var(--color-subtle);
      }

      .bottom-btn:active {
        transform: scale(0.95);
      }

      #sound-toggle {
        right: var(--spacing);
      }

      #sound-toggle.on {
        color: var(--color-success);
        border-color: var(--color-success);
      }

      #reset-btn {
        right: 120px;
      }

      #reset-btn:hover {
        color: var(--color-accent);
        border-color: var(--color-accent);
      }

      #theme-btn {
        left: var(--spacing);
      }

      #mode-btn {
        left: 120px;
      }

      /* Confirmation modal */
      #modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        display: none;
        justify-content: center;
        align-items: center;
      }

      #modal-overlay.show {
        display: flex;
      }

      #modal {
        background: var(--color-bg);
        border: 2px solid var(--color-border);
        padding: 24px 32px;
        text-align: center;
        max-width: 300px;
      }

      #modal-message {
        font-size: 14px;
        letter-spacing: 0.1em;
        color: var(--color-text);
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      #modal-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .modal-btn {
        font-family: var(--font-body);
        font-size: 11px;
        letter-spacing: 0.1em;
        padding: 10px 20px;
        cursor: pointer;
        text-transform: uppercase;
        border: var(--border-style) var(--color-border);
        background: none;
        color: var(--color-muted);
        transition: color 0.1s, border-color 0.1s, transform 0.05s;
        min-height: 44px;
      }

      .modal-btn:active {
        transform: scale(0.95);
      }

      #modal-confirm {
        color: var(--color-accent);
        border-color: var(--color-accent);
      }

      #modal-confirm:hover {
        color: var(--color-text);
        background: var(--color-accent);
      }

      #modal-cancel:hover {
        color: var(--color-text);
        border-color: var(--color-muted);
      }

      /* ==========================================
         THEME-SPECIFIC STYLES
         ========================================== */

      /* ARCADE: Bigger, chunkier text, scanlines */
      [data-theme="arcade"] #dps-num {
        letter-spacing: 0.05em;
        text-shadow:
          6px 6px 0 var(--color-accent),
          -3px -3px 0 var(--color-success);
      }

      [data-theme="arcade"] .hit {
        font-size: 36px;
      }

      [data-theme="arcade"] .hit.crit {
        font-size: 56px;
      }

      [data-theme="arcade"]::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.1) 0px,
          rgba(0, 0, 0, 0.1) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
        z-index: 9998;
      }

      /* SYNTH: Glowy, warm sunset vibes */
      [data-theme="synth"] #dps-num {
        text-shadow:
          0 0 20px var(--color-accent),
          4px 4px 0 var(--color-accent),
          -2px -2px 0 var(--color-success);
      }

      [data-theme="synth"] .hit {
        text-shadow: 0 0 10px currentColor;
      }

      [data-theme="synth"] .hit.crit {
        text-shadow: 0 0 20px var(--color-accent), 0 0 40px var(--color-accent);
      }

      [data-theme="synth"] .ring {
        box-shadow: 0 0 15px var(--color-accent);
      }

      [data-theme="synth"] #intensity-glow {
        background: radial-gradient(ellipse at 50% 100%, var(--color-glow) 0%, transparent 60%);
      }

      /* BRUTAL: Heavy, raw, in your face */
      [data-theme="brutal"] #dps-num {
        text-shadow:
          8px 8px 0 var(--color-accent),
          -4px -4px 0 var(--color-border);
        letter-spacing: 0.02em;
      }

      [data-theme="brutal"] .hit {
        font-family: 'Arial Black', sans-serif;
      }

      [data-theme="brutal"] .hit.crit {
        font-size: 64px;
      }

      [data-theme="brutal"] #flash {
        mix-blend-mode: multiply;
      }

      [data-theme="brutal"] .corner {
        display: none;
      }

      [data-theme="brutal"] .ring {
        border-width: 4px;
      }

      /* BLOOM: Soft, rounded, cute */
      [data-theme="bloom"] #dps-num {
        text-shadow:
          3px 3px 0 var(--color-accent),
          -2px -2px 0 var(--color-success);
        letter-spacing: 0.02em;
      }

      [data-theme="bloom"] .hit {
        font-family: 'Quicksand', cursive;
        font-weight: 700;
      }

      [data-theme="bloom"] .hit.crit {
        color: var(--color-accent);
        text-shadow: 0 0 15px var(--color-accent), 0 0 30px rgba(255, 107, 157, 0.5);
      }

      [data-theme="bloom"] .corner {
        border-radius: 8px;
      }

      [data-theme="bloom"] .ring {
        border-color: var(--color-accent);
        border-width: 3px;
        box-shadow: 0 0 10px var(--color-glow);
      }

      [data-theme="bloom"] .bottom-btn {
        border-radius: 20px;
      }

      [data-theme="bloom"] #modal {
        border-radius: 16px;
      }

      [data-theme="bloom"] .modal-btn {
        border-radius: 12px;
      }

      [data-theme="bloom"] #intensity-glow {
        background: radial-gradient(circle at 50% 50%, rgba(255, 107, 157, 0.3) 0%, rgba(126, 217, 159, 0.1) 50%, transparent 70%);
      }

      /* FX Canvas for theme-specific effects */
      #fx-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 4;
      }

      /* ==========================================
         LIVES DISPLAY
         ========================================== */
      #lives {
        position: fixed;
        top: var(--spacing);
        right: var(--spacing);
        z-index: 100;
        display: flex;
        gap: 8px;
      }

      .life {
        width: 28px;
        height: 28px;
        transition: opacity 0.3s, transform 0.3s;
      }

      .life.lost {
        opacity: 0.25;
        transform: scale(0.8);
      }

      .life.healing {
        animation: life-heal 0.5s ease-out;
      }

      @keyframes life-heal {
        0% { transform: scale(1.5); opacity: 0.5; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* ==========================================
         TARGET MODE HUD
         ========================================== */
      #target-hud {
        position: fixed;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
      }

      #target-round {
        font-family: var(--font-main);
        font-size: 14px;
        letter-spacing: 0.2em;
        color: var(--color-muted);
        margin-bottom: 8px;
      }

      #target-count {
        font-family: var(--font-main);
        font-size: 32px;
        font-weight: 900;
        color: var(--color-success);
      }

      #target-timer {
        font-size: 18px;
        color: var(--color-accent);
        margin-top: 4px;
      }

      /* ==========================================
         RHYTHM MODE HUD
         ========================================== */
      #rhythm-hud {
        position: fixed;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
      }

      #rhythm-score-label {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--color-muted);
      }

      #rhythm-score {
        font-family: var(--font-main);
        font-size: 48px;
        font-weight: 900;
        color: var(--color-success);
        line-height: 1;
      }

      #rhythm-streak {
        font-size: 18px;
        color: var(--color-accent);
        margin-top: 8px;
      }

      #rhythm-bpm {
        font-size: 12px;
        color: var(--color-muted);
        margin-top: 4px;
      }

      /* ==========================================
         GAME TARGETS
         ========================================== */
      .game-target {
        position: absolute;
        width: 90px;
        height: 90px;
        border: 3px solid var(--color-accent);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 50;
        box-shadow: 0 0 20px var(--color-glow);
      }

      .game-target::before {
        content: '';
        position: absolute;
        inset: -8px;
        border: 2px solid var(--color-accent);
        border-radius: 50%;
        opacity: 0.5;
        animation: target-pulse 1s ease-in-out infinite;
      }

      .game-target::after {
        content: '';
        position: absolute;
        inset: 35%;
        background: var(--color-accent);
        border-radius: 50%;
        opacity: 0.8;
      }

      @keyframes target-pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.3; }
      }

      .target-shrink {
        position: absolute;
        inset: -15px;
        border: 3px solid var(--color-success);
        border-radius: 50%;
        animation: target-shrink-anim var(--shrink-duration, 2s) linear forwards;
      }

      @keyframes target-shrink-anim {
        0% { transform: scale(1.5); opacity: 1; }
        100% { transform: scale(1); opacity: 0.3; }
      }

      /* ==========================================
         RHYTHM NOTES
         ========================================== */
      .rhythm-note {
        position: absolute;
        width: 80px;
        height: 80px;
        border: 3px solid var(--color-accent);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 50;
      }

      .rhythm-note::after {
        content: '';
        position: absolute;
        inset: 30%;
        background: var(--color-accent);
        border-radius: 50%;
      }

      .note-approach {
        position: absolute;
        inset: -20px;
        border: 3px solid var(--color-success);
        border-radius: 50%;
        animation: note-approach-anim var(--approach-time, 1.2s) linear forwards;
      }

      @keyframes note-approach-anim {
        0% { transform: scale(2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* ==========================================
         POWER-UPS
         ========================================== */
      .power-up {
        position: absolute;
        width: 50px;
        height: 50px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 52;
        animation: power-up-float 0.5s ease-in-out infinite alternate;
      }

      @keyframes power-up-float {
        0% { transform: translate(-50%, -50%) translateY(0); }
        100% { transform: translate(-50%, -50%) translateY(-5px); }
      }

      .power-up-heart {
        width: 100%;
        height: 100%;
        background: var(--color-success);
        clip-path: path('M25,45 C25,20 0,20 0,35 C0,50 25,65 25,65 C25,65 50,50 50,35 C50,20 25,20 25,45');
        filter: drop-shadow(0 0 10px var(--color-success));
      }

      /* ==========================================
         ROUND SPLASH
         ========================================== */
      #round-splash {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9000;
      }

      #round-splash.show {
        display: flex;
        animation: splash-in 0.3s ease-out;
      }

      #round-splash .round-text {
        font-family: var(--font-main);
        font-size: 64px;
        font-weight: 900;
        color: var(--color-accent);
        text-shadow: 0 0 40px var(--color-glow);
        animation: round-text-pulse 0.5s ease-out;
      }

      @keyframes splash-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes round-text-pulse {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); opacity: 1; }
      }

      /* ==========================================
         GAME OVER
         ========================================== */
      #game-over-overlay {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10001;
      }

      #game-over-overlay.show {
        display: flex;
      }

      #game-over-content {
        text-align: center;
        padding: 40px;
      }

      #game-over-title {
        font-family: var(--font-main);
        font-size: 48px;
        font-weight: 900;
        color: var(--color-accent);
        margin-bottom: 24px;
        text-shadow: 0 0 30px var(--color-glow);
      }

      #game-over-score {
        font-size: 24px;
        color: var(--color-text);
        margin-bottom: 8px;
      }

      #game-over-best {
        font-size: 16px;
        color: var(--color-success);
        margin-bottom: 32px;
      }

      /* ==========================================
         HIT FEEDBACK FOR MODES
         ========================================== */
      .hit-perfect {
        color: var(--color-success) !important;
        text-shadow: 0 0 20px var(--color-success) !important;
      }

      .hit-good {
        color: var(--color-accent) !important;
      }

      .hit-miss {
        color: var(--color-muted) !important;
      }

      /* ==========================================
         THEME-SPECIFIC: GAME ELEMENTS
         ========================================== */

      /* Cyber targets */
      [data-theme="cyber"] .game-target {
        border-style: dashed;
        animation: cyber-target-scan 1s linear infinite;
      }

      @keyframes cyber-target-scan {
        0% { border-color: var(--color-accent); }
        50% { border-color: var(--color-success); }
        100% { border-color: var(--color-accent); }
      }

      /* Arcade targets */
      [data-theme="arcade"] .game-target {
        border-radius: 0;
        border-width: 4px;
      }

      [data-theme="arcade"] .game-target::after {
        border-radius: 0;
        inset: 30%;
      }

      /* Synth targets */
      [data-theme="synth"] .game-target {
        box-shadow: 0 0 30px var(--color-accent), inset 0 0 20px var(--color-glow);
      }

      /* Brutal targets */
      [data-theme="brutal"] .game-target {
        border-radius: 0;
        border-width: 6px;
        border-color: var(--color-accent);
        box-shadow: none;
      }

      [data-theme="brutal"] .game-target::before {
        display: none;
      }

      /* Bloom targets */
      [data-theme="bloom"] .game-target {
        border-color: var(--color-accent);
        box-shadow: 0 0 25px var(--color-glow);
      }

      [data-theme="bloom"] .game-target::after {
        background: linear-gradient(135deg, var(--color-accent), var(--color-success));
      }
    </style>
  </head>

  <body>
    <div id="shake-container">
      <div id="grid-bg"></div>
      <div id="intensity-glow"></div>
      <div id="edge-glow"></div>
      <canvas id="fx-canvas"></canvas>

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div id="flash"></div>

      <div id="hud">

      <!-- Lives display -->

      </div>

      <!-- Rhythm mode HUD -->
      <div id="rhythm-hud" style="display: none;">
        <div id="rhythm-score-label">SCORE</div>
        <div id="rhythm-score">0</div>
        <div id="rhythm-streak"><span id="streak-count">0</span>x STREAK</div>
        <div id="rhythm-bpm"><span id="bpm-value">100</span> BPM</div>
      </div>

      <div id="bar-container">
        <div id="bar-label">intensity</div>
        <div id="bar"><div id="bar-fill"></div></div>
      </div>

      <div id="hint">click to destroy</div>
    </div>

    <button id="theme-btn" class="bottom-btn" aria-label="Change color theme">cyber</button>
    <button id="mode-btn" class="bottom-btn" aria-label="Change game mode">standard</button>
    <button id="reset-btn" class="bottom-btn" aria-label="Reset all stats and high score">reset</button>
    <button id="sound-toggle" class="bottom-btn" aria-label="Toggle sound on or off" aria-pressed="false">sound: off</button>

    <div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-message">
      <div id="modal">
        <div id="modal-message">Reset all stats and high score?</div>
        <div id="modal-buttons">
          <button id="modal-cancel" class="modal-btn">Cancel</button>
          <button id="modal-confirm" class="modal-btn">Reset</button>
        </div>
      </div>
    </div>

    <!-- Round transition splash -->
    <div id="round-splash"></div>

    <!-- Game over overlay -->
    <div id="game-over-overlay">
      <div id="game-over-content">
        <div id="game-over-title">GAME OVER</div>
        <div id="game-over-score"></div>
        <div id="game-over-best"></div>
        <button id="game-over-restart" class="modal-btn">PLAY AGAIN</button>
      </div>
    </div>

    <script>
      // ===========================================
      // GAME CONFIGURATION
      // ===========================================
      const CONFIG = {
        // Damage
        BASE_DAMAGE: 10,
        CRIT_MULTIPLIER: 3,
        COMBO_DAMAGE_BONUS: 0.04,

        // Combo system
        COMBO_WINDOW_MS: 300,
        COMBO_DECAY_MS: 400,
        MAX_COMBO: 99,

        // Critical hits
        BASE_CRIT_CHANCE: 0.12,
        CRIT_CHANCE_PER_COMBO: 0.008,

        // Timing
        DPS_WINDOW_MS: 1000,
        TICK_INTERVAL_MS: 50,

        // UI
        INTENSITY_BAR_MAX_HITS: 10,

        // Storage keys
        STORAGE_KEY_BEST: 'clickdps-best',
        STORAGE_KEY_SOUND: 'clickdps-sound',
        STORAGE_KEY_THEME: 'clickdps-theme',
        STORAGE_KEY_MODE: 'clickdps-mode',

        // Visual effects
        MAX_SHAKE: 8,
        SHAKE_DECAY: 0.9,
        TRAIL_LENGTH: 8,
        PARTICLE_COUNT: 12,

        // Milestones
        DAMAGE_MILESTONES: [1000, 5000, 10000, 25000, 50000, 100000],
        DPS_MILESTONES: [100, 250, 500, 1000, 2000],

        // Themes
        THEMES: ['cyber', 'arcade', 'synth', 'brutal', 'bloom'],

        // Game Modes
        MODES: ['standard', 'target', 'rhythm'],

        // Lives System
        DEFAULT_LIVES: 3,
        MAX_LIVES: 3,

        // Target Mode
        TARGET: {
          ROUND_DURATION_BASE: 25000,
          ROUND_DURATION_MIN: 15000,
          ROUND_DURATION_DECREASE: 500,
          TARGETS_REQUIRED_BASE: 5,
          TARGETS_INCREASE_PER_LEVEL: 2,
          MAX_TARGETS_REQUIRED: 20,
          TARGET_DURATION_BASE: 2500,
          TARGET_DURATION_MIN: 1000,
          TARGET_DURATION_DECREASE: 50,
          SPAWN_INTERVAL_BASE: 1200,
          SPAWN_INTERVAL_MIN: 500,
          SPAWN_INTERVAL_DECREASE: 30,
          TARGET_RADIUS: 45,
          MAX_CONCURRENT: 3,
          SAFE_MARGIN: 80,
          ROUND_TRANSITION_MS: 1500,
        },

        // Rhythm Mode
        RHYTHM: {
          BPM_BASE: 100,
          BPM_INCREASE: 5,
          BPM_MAX: 160,
          NOTE_APPROACH_TIME: 1200,
          PERFECT_WINDOW: 50,
          GOOD_WINDOW: 120,
          NOTE_RADIUS: 40,
          SCORE_PERFECT: 300,
          SCORE_GOOD: 100,
          MISS_THRESHOLD: 3,
          STREAK_MULTIPLIER: 0.01,
        },

        // Power-ups
        POWER_UP: {
          SPAWN_CHANCE: 0.005,
          DURATION: 2000,
          RADIUS: 30,
        },
      };

      // ===========================================
      // SAFE LOCALSTORAGE HELPERS
      // ===========================================
      function safeGetItem(key, defaultValue = null) {
        try {
          return localStorage.getItem(key) ?? defaultValue;
        } catch {
          return defaultValue;
        }
      }

      function safeSetItem(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // Storage full or unavailable (private browsing)
        }
      }

      function safeRemoveItem(key) {
        try {
          localStorage.removeItem(key);
        } catch {
          // Storage unavailable
        }
      }

      // ===========================================
      // STATE
      // ===========================================
      const S = {
        base: CONFIG.BASE_DAMAGE,
        combo: 0,
        last: 0,
        log: [],
        hits: 0,
        dmg: 0,
        crits: 0,
        best: parseInt(safeGetItem(CONFIG.STORAGE_KEY_BEST, '0')),
        lastMilestoneDmg: 0,
        lastMilestoneDps: 0,
        shakeIntensity: 0,
        mouseX: 0,
        mouseY: 0,
        trailPoints: [],

        // Game mode
        mode: 'standard',
        lives: CONFIG.DEFAULT_LIVES,
        maxLives: CONFIG.MAX_LIVES,
        gameOver: false,

        // Target mode state
        target: {
          round: 1,
          timeRemaining: 0,
          targetsHit: 0,
          targetsRequired: CONFIG.TARGET.TARGETS_REQUIRED_BASE,
          active: [],
          powerUp: null,
          spawnTimer: null,
          roundTimer: null,
          inTransition: false,
        },

        // Rhythm mode state
        rhythm: {
          bpm: CONFIG.RHYTHM.BPM_BASE,
          score: 0,
          streak: 0,
          bestStreak: 0,
          missCount: 0,
          notes: [],
          powerUp: null,
          beatTimer: null,
          lastBeat: 0,
          level: 1,
        },
      };

      // ===========================================
      // DOM REFERENCES
      // ===========================================
      const $ = id => document.getElementById(id);
      const dps = $('dps-num');
      const comboEl = $('combo');
      const flash = $('flash');
      const bar = $('bar-fill');
      const bestEl = $('best-value');
      const newBestEl = $('new-best');
      const hint = $('hint');
      const shakeContainer = $('shake-container');
      const gridBg = $('grid-bg');
      const intensityGlow = $('intensity-glow');
      const edgeGlow = $('edge-glow');
      const milestoneEl = $('milestone');
      const themeBtn = $('theme-btn');
      const modeBtn = $('mode-btn');
      const fxCanvas = $('fx-canvas');
      const fxCtx = fxCanvas.getContext('2d');

      // Mode-specific DOM refs
      const livesContainer = $('lives');
      const targetHud = $('target-hud');
      const targetRoundNum = $('target-round-num');
      const targetsHitEl = $('targets-hit');
      const targetsRequiredEl = $('targets-required');
      const timeRemainingEl = $('time-remaining');
      const rhythmHud = $('rhythm-hud');
      const rhythmScoreEl = $('rhythm-score');
      const streakCountEl = $('streak-count');
      const bpmValueEl = $('bpm-value');
      const roundSplash = $('round-splash');
      const gameOverOverlay = $('game-over-overlay');
      const gameOverScore = $('game-over-score');
      const gameOverBest = $('game-over-best');
      const gameOverRestart = $('game-over-restart');

      // ===========================================
      // FX CANVAS SETUP
      // ===========================================
      function resizeCanvas() {
        fxCanvas.width = window.innerWidth;
        fxCanvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Active effects storage
      const activeEffects = [];

      // Cached gradients for performance
      let synthGradientCache = null;
      let synthGradientHeight = 0;

      function getSynthGradient(height) {
        // Only recreate gradient if height changed significantly
        if (!synthGradientCache || Math.abs(height - synthGradientHeight) > 10) {
          synthGradientHeight = height;
          synthGradientCache = fxCtx.createLinearGradient(0, fxCanvas.height - height, 0, fxCanvas.height);
          synthGradientCache.addColorStop(0, '#ff2975');
          synthGradientCache.addColorStop(0.5, '#f6d365');
          synthGradientCache.addColorStop(1, '#c56cf0');
        }
        return synthGradientCache;
      }

      // ===========================================
      // UNIFIED ANIMATION SYSTEM
      // ===========================================
      // All animations are managed in a single RAF loop for maximum performance
      const animations = {
        particles: [],  // {el, startTime, duration, x, y, vx, vy, ...}
        trails: [],     // {el, startTime, duration, ...}
        fxActive: false
      };
      let animationFrameId = null;

      function runAnimationLoop(timestamp) {
        const now = performance.now();
        let hasActiveAnimations = false;

        // Process particles
        for (let i = animations.particles.length - 1; i >= 0; i--) {
          const p = animations.particles[i];
          const elapsed = now - p.startTime;
          const progress = elapsed / p.duration;

          if (progress >= 1) {
            release(p.el);
            animations.particles.splice(i, 1);
            continue;
          }

          hasActiveAnimations = true;
          const currentX = (p.x + p.vx * progress) | 0;
          const currentY = (p.y + p.vy * progress + progress * progress * 200) | 0;
          p.el.style.left = currentX + 'px';
          p.el.style.top = currentY + 'px';
          p.el.style.opacity = 1 - progress;
          p.el.style.transform = `translateZ(0) scale(${1 - progress * 0.5})`;
        }

        // Process trails
        for (let i = animations.trails.length - 1; i >= 0; i--) {
          const t = animations.trails[i];
          const elapsed = now - t.startTime;
          const progress = elapsed / t.duration;

          if (progress >= 1) {
            release(t.el);
            animations.trails.splice(i, 1);
            continue;
          }

          hasActiveAnimations = true;
          t.el.style.opacity = 0.6 * (1 - progress);
          t.el.style.transform = `translate(-50%, -50%) translateZ(0) scale(${1 - progress * 0.5})`;
        }

        // Process canvas FX effects
        if (activeEffects.length > 0) {
          hasActiveAnimations = true;
          renderFxEffectsFrame(now);
        }

        // Continue loop if there are active animations
        if (hasActiveAnimations) {
          animationFrameId = requestAnimationFrame(runAnimationLoop);
        } else {
          animationFrameId = null;
        }
      }

      function startAnimationLoop() {
        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(runAnimationLoop);
        }
      }

      // ===========================================
      // THEME-SPECIFIC VISUAL EFFECTS
      // ===========================================

      // CYBER: Digital glitch lines
      function triggerCyberEffect(x, y, intensity) {
        const lineCount = 3 + Math.floor(intensity * 5);
        for (let i = 0; i < lineCount; i++) {
          activeEffects.push({
            type: 'cyber-glitch',
            startTime: performance.now(),
            duration: 150 + Math.random() * 100,
            y: Math.random() * fxCanvas.height,
            width: 50 + Math.random() * 200,
            height: 2 + Math.random() * 4,
            offset: (Math.random() - 0.5) * 20,
            color: Math.random() > 0.5 ? '#ff0080' : '#00ffff',
          });
        }
        // Add horizontal scan line
        activeEffects.push({
          type: 'cyber-scan',
          startTime: performance.now(),
          duration: 200,
          y: y,
          speed: (Math.random() > 0.5 ? 1 : -1) * (300 + Math.random() * 200),
        });
      }

      // ARCADE: Pixel burst explosion
      function triggerArcadeEffect(x, y, intensity) {
        const pixelCount = 8 + Math.floor(intensity * 12);
        const colors = ['#eeff00', '#ff0055', '#00ff88', '#aa88ff'];
        for (let i = 0; i < pixelCount; i++) {
          const angle = (Math.PI * 2 * i) / pixelCount;
          const speed = 150 + Math.random() * 200;
          activeEffects.push({
            type: 'arcade-pixel',
            startTime: performance.now(),
            duration: 400 + Math.random() * 200,
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 8 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
          });
        }
      }

      // SYNTH: Audio waveform bars
      function triggerSynthEffect(x, y, intensity) {
        const barCount = 12 + Math.floor(intensity * 8);
        const barWidth = fxCanvas.width / barCount;
        for (let i = 0; i < barCount; i++) {
          const distFromClick = Math.abs((i * barWidth + barWidth / 2) - x);
          const maxDist = fxCanvas.width / 2;
          const proximity = 1 - Math.min(distFromClick / maxDist, 1);
          activeEffects.push({
            type: 'synth-bar',
            startTime: performance.now(),
            duration: 300 + proximity * 200,
            x: i * barWidth,
            width: barWidth - 2,
            maxHeight: (50 + proximity * 150) * (0.5 + intensity * 0.5),
            delay: distFromClick / 800,
          });
        }
      }

      // BRUTAL: Geometric X slash
      function triggerBrutalEffect(x, y, intensity) {
        const size = 60 + intensity * 80;
        activeEffects.push({
          type: 'brutal-x',
          startTime: performance.now(),
          duration: 300,
          x: x,
          y: y,
          size: size,
        });
        // Add impact circle
        activeEffects.push({
          type: 'brutal-circle',
          startTime: performance.now(),
          duration: 250,
          x: x,
          y: y,
          maxRadius: size * 0.8,
        });
      }

      // BLOOM: Floating petals and hearts
      function triggerBloomEffect(x, y, intensity) {
        const count = 6 + Math.floor(intensity * 8);
        const now = performance.now();
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
          const speed = 80 + Math.random() * 120;
          activeEffects.push({
            type: 'bloom-petal',
            startTime: now,
            duration: 800 + Math.random() * 400,
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 50, // Float upward
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 400,
            size: 8 + Math.random() * 8,
            hue: Math.random() > 0.5 ? 340 : 140, // Pink or green
          });
        }
        // Add sparkles
        for (let i = 0; i < 4; i++) {
          activeEffects.push({
            type: 'bloom-sparkle',
            startTime: now,
            duration: 400 + Math.random() * 200,
            x: x + (Math.random() - 0.5) * 60,
            y: y + (Math.random() - 0.5) * 60,
            size: 3 + Math.random() * 4,
          });
        }
      }

      // Render all active effects (called from unified animation loop)
      function renderFxEffectsFrame(now) {
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

        for (let i = activeEffects.length - 1; i >= 0; i--) {
          const fx = activeEffects[i];
          const elapsed = now - fx.startTime - (fx.delay || 0);
          if (elapsed < 0) continue;
          const progress = Math.min(elapsed / fx.duration, 1);

          if (progress >= 1) {
            activeEffects.splice(i, 1);
            continue;
          }

          switch (fx.type) {
            case 'cyber-glitch':
              fxCtx.fillStyle = fx.color;
              fxCtx.globalAlpha = (1 - progress) * 0.8;
              fxCtx.fillRect(
                (fx.offset + Math.random() * 10) | 0,
                (fx.y + Math.random() * 3) | 0,
                (fx.width * (1 - progress * 0.5)) | 0,
                fx.height | 0
              );
              break;

            case 'cyber-scan':
              const scanY = (fx.y + fx.speed * (elapsed / 1000)) | 0;
              fxCtx.strokeStyle = '#00ffff';
              fxCtx.globalAlpha = (1 - progress) * 0.5;
              fxCtx.lineWidth = 1;
              fxCtx.beginPath();
              fxCtx.moveTo(0, scanY);
              fxCtx.lineTo(fxCanvas.width, scanY);
              fxCtx.stroke();
              break;

            case 'arcade-pixel':
              const t = elapsed / 1000;
              const px = (fx.x + fx.vx * t) | 0;
              const py = (fx.y + fx.vy * t + t * t * 400) | 0;
              const size = fx.size | 0;
              fxCtx.fillStyle = fx.color;
              fxCtx.globalAlpha = 1 - progress;
              fxCtx.fillRect(px - (size >> 1), py - (size >> 1), size, size);
              break;

            case 'synth-bar':
              const wave = Math.sin(progress * Math.PI);
              const barHeight = (fx.maxHeight * wave) | 0;
              fxCtx.fillStyle = getSynthGradient(barHeight);
              fxCtx.globalAlpha = (1 - progress * 0.5) * 0.7;
              fxCtx.fillRect(fx.x | 0, fxCanvas.height - barHeight, fx.width | 0, barHeight);
              break;

            case 'brutal-x':
              const xSize = (fx.size * (0.3 + progress * 0.7)) | 0;
              const halfSize = xSize >> 1;
              fxCtx.strokeStyle = '#ff0000';
              fxCtx.globalAlpha = 1 - progress;
              fxCtx.lineWidth = (6 + (1 - progress) * 4) | 0;
              fxCtx.lineCap = 'square';
              fxCtx.beginPath();
              fxCtx.moveTo(fx.x - halfSize, fx.y - halfSize);
              fxCtx.lineTo(fx.x + halfSize, fx.y + halfSize);
              fxCtx.moveTo(fx.x + halfSize, fx.y - halfSize);
              fxCtx.lineTo(fx.x - halfSize, fx.y + halfSize);
              fxCtx.stroke();
              break;

            case 'brutal-circle':
              const radius = (fx.maxRadius * progress) | 0;
              fxCtx.strokeStyle = '#000000';
              fxCtx.globalAlpha = (1 - progress) * 0.8;
              fxCtx.lineWidth = 4;
              fxCtx.beginPath();
              fxCtx.arc(fx.x | 0, fx.y | 0, radius, 0, Math.PI * 2);
              fxCtx.stroke();
              break;

            case 'bloom-petal':
              const pt = elapsed / 1000;
              const petalX = (fx.x + fx.vx * pt) | 0;
              const petalY = (fx.y + fx.vy * pt - pt * 30) | 0; // Float up
              const rot = (fx.rotation + fx.rotSpeed * pt) * Math.PI / 180;
              fxCtx.save();
              fxCtx.translate(petalX, petalY);
              fxCtx.rotate(rot);
              fxCtx.globalAlpha = 1 - progress;
              // Draw petal/heart shape
              fxCtx.fillStyle = `hsl(${fx.hue}, 70%, 70%)`;
              fxCtx.beginPath();
              const ps = fx.size * (1 - progress * 0.3);
              // Heart shape
              fxCtx.moveTo(0, ps * 0.3);
              fxCtx.bezierCurveTo(-ps * 0.5, -ps * 0.3, -ps, ps * 0.3, 0, ps);
              fxCtx.bezierCurveTo(ps, ps * 0.3, ps * 0.5, -ps * 0.3, 0, ps * 0.3);
              fxCtx.fill();
              fxCtx.restore();
              break;

            case 'bloom-sparkle':
              const sparkleSize = fx.size * (1 - progress);
              const sparkleAlpha = (1 - progress) * Math.sin(progress * Math.PI * 3);
              fxCtx.fillStyle = '#fff';
              fxCtx.globalAlpha = Math.max(0, sparkleAlpha);
              fxCtx.beginPath();
              // 4-point star
              const sx = fx.x | 0, sy = fx.y | 0;
              fxCtx.moveTo(sx, sy - sparkleSize);
              fxCtx.lineTo(sx + sparkleSize * 0.3, sy);
              fxCtx.lineTo(sx, sy + sparkleSize);
              fxCtx.lineTo(sx - sparkleSize * 0.3, sy);
              fxCtx.closePath();
              fxCtx.fill();
              fxCtx.beginPath();
              fxCtx.moveTo(sx - sparkleSize, sy);
              fxCtx.lineTo(sx, sy + sparkleSize * 0.3);
              fxCtx.lineTo(sx + sparkleSize, sy);
              fxCtx.lineTo(sx, sy - sparkleSize * 0.3);
              fxCtx.closePath();
              fxCtx.fill();
              break;
          }
        }

        fxCtx.globalAlpha = 1;
      }

      // Trigger effect based on current theme
      function triggerThemeEffect(x, y, crit) {
        const theme = CONFIG.THEMES[currentThemeIndex];
        const intensity = Math.min(S.combo / 20, 1) * (crit ? 1.5 : 1);

        switch (theme) {
          case 'cyber':
            triggerCyberEffect(x, y, intensity);
            break;
          case 'arcade':
            triggerArcadeEffect(x, y, intensity);
            break;
          case 'synth':
            triggerSynthEffect(x, y, intensity);
            break;
          case 'brutal':
            triggerBrutalEffect(x, y, intensity);
            break;
          case 'bloom':
            triggerBloomEffect(x, y, intensity);
            break;
        }

        startAnimationLoop();
      }

      // Initialize best display
      bestEl.textContent = S.best;

      // ===========================================
      // THEME SYSTEM
      // ===========================================
      let currentThemeIndex = CONFIG.THEMES.indexOf(safeGetItem(CONFIG.STORAGE_KEY_THEME, 'cyber'));
      if (currentThemeIndex === -1) currentThemeIndex = 0;
      document.body.setAttribute('data-theme', CONFIG.THEMES[currentThemeIndex]);
      themeBtn.textContent = CONFIG.THEMES[currentThemeIndex];

      function cycleTheme(e) {
        e.stopPropagation();
        currentThemeIndex = (currentThemeIndex + 1) % CONFIG.THEMES.length;
        const theme = CONFIG.THEMES[currentThemeIndex];
        document.body.setAttribute('data-theme', theme);
        safeSetItem(CONFIG.STORAGE_KEY_THEME, theme);
        themeBtn.textContent = theme;
      }

      themeBtn.addEventListener('click', cycleTheme);

      // ===========================================
      // GAME MODE SYSTEM
      // ===========================================
      let currentModeIndex = CONFIG.MODES.indexOf(safeGetItem(CONFIG.STORAGE_KEY_MODE, 'standard'));
      if (currentModeIndex === -1) currentModeIndex = 0;
      S.mode = CONFIG.MODES[currentModeIndex];
      modeBtn.textContent = CONFIG.MODES[currentModeIndex];

      let targetIdCounter = 0;
      let noteIdCounter = 0;

      function cycleMode(e) {
        e.stopPropagation();
        if (S.gameOver) return;
        cleanupMode();
        currentModeIndex = (currentModeIndex + 1) % CONFIG.MODES.length;
        const mode = CONFIG.MODES[currentModeIndex];
        S.mode = mode;
        safeSetItem(CONFIG.STORAGE_KEY_MODE, mode);
        modeBtn.textContent = mode;
        initMode(mode);
      }

      modeBtn.addEventListener('click', cycleMode);

      function cleanupMode() {
        // Clear target mode
        if (S.target.spawnTimer) clearTimeout(S.target.spawnTimer);
        if (S.target.roundTimer) clearInterval(S.target.roundTimer);
        S.target.active.forEach(t => { if (t.el) release(t.el); });
        S.target.active = [];
        if (S.target.powerUp) { release(S.target.powerUp.el); S.target.powerUp = null; }

        // Clear rhythm mode
        if (S.rhythm.beatTimer) clearInterval(S.rhythm.beatTimer);
        S.rhythm.notes.forEach(n => { if (n.el) release(n.el); });
        S.rhythm.notes = [];
        if (S.rhythm.powerUp) { release(S.rhythm.powerUp.el); S.rhythm.powerUp = null; }

        // Hide HUDs
        targetHud.style.display = 'none';
        rhythmHud.style.display = 'none';
        roundSplash.classList.remove('show');
      }

      function initMode(mode) {
        // Reset common state
        S.combo = 0;
        S.log = [];
        S.last = 0;
        S.lives = CONFIG.DEFAULT_LIVES;
        S.gameOver = false;
        gameOverOverlay.classList.remove('show');

        // Update UI visibility
        const standardHud = document.getElementById('hud');
        const bestDisplay = document.getElementById('best');
        const statsDisplay = document.getElementById('stats');
        const barContainer = document.getElementById('bar-container');

        if (mode === 'standard') {
          standardHud.style.display = 'block';
          bestDisplay.style.display = 'block';
          statsDisplay.style.display = 'block';
          barContainer.style.display = 'block';
          livesContainer.style.display = 'none';
          targetHud.style.display = 'none';
          rhythmHud.style.display = 'none';
        } else if (mode === 'target') {
          standardHud.style.display = 'none';
          bestDisplay.style.display = 'none';
          statsDisplay.style.display = 'none';
          barContainer.style.display = 'none';
          livesContainer.style.display = 'flex';
          targetHud.style.display = 'block';
          rhythmHud.style.display = 'none';
          initTargetMode();
        } else if (mode === 'rhythm') {
          standardHud.style.display = 'none';
          bestDisplay.style.display = 'none';
          statsDisplay.style.display = 'none';
          barContainer.style.display = 'none';
          livesContainer.style.display = 'flex';
          targetHud.style.display = 'none';
          rhythmHud.style.display = 'block';
          initRhythmMode();
        }

        renderLives();
        render();
      }

      // ===========================================
      // LIVES SYSTEM
      // ===========================================
      function renderLives() {
        livesContainer.innerHTML = '';
        for (let i = 0; i < S.maxLives; i++) {
          const life = document.createElement('div');
          life.className = 'life' + (i >= S.lives ? ' lost' : '');
          life.innerHTML = `<svg viewBox="0 0 24 24" fill="${i < S.lives ? 'var(--color-accent)' : 'var(--color-muted)'}">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>`;
          livesContainer.appendChild(life);
        }
      }

      function loseLife() {
        S.lives--;
        renderLives();
        playLifeLostSound();

        if (S.lives <= 0) {
          triggerGameOver();
        } else if (S.mode === 'target') {
          // Restart same round
          showRoundSplash('TRY AGAIN', () => startTargetRound());
        }
      }

      function gainLife() {
        if (S.lives < S.maxLives) {
          S.lives++;
          renderLives();
          playPowerUpSound();
          // Animate the healed heart
          const hearts = livesContainer.querySelectorAll('.life');
          if (hearts[S.lives - 1]) {
            hearts[S.lives - 1].classList.add('healing');
            setTimeout(() => hearts[S.lives - 1].classList.remove('healing'), 500);
          }
        }
      }

      function playLifeLostSound() {
        if (!soundEnabled) return;
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(200, now);
        o.frequency.exponentialRampToValueAtTime(50, now + 0.3);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        o.connect(g); g.connect(ctx.destination);
        o.start(now); o.stop(now + 0.3);
      }

      function playPowerUpSound() {
        if (!soundEnabled) return;
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        [400, 600, 800].forEach((freq, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + i * 0.1);
          g.gain.setValueAtTime(0.2, now + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.15);
          o.connect(g); g.connect(ctx.destination);
          o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.15);
        });
      }

      // ===========================================
      // TARGET MODE
      // ===========================================
      function initTargetMode() {
        S.target.round = 1;
        S.target.targetsHit = 0;
        S.target.targetsRequired = CONFIG.TARGET.TARGETS_REQUIRED_BASE;
        S.target.active = [];
        S.target.inTransition = false;
        calculateTargetRoundParams();
        showRoundSplash('ROUND 1', () => startTargetRound());
      }

      function calculateTargetRoundParams() {
        const level = S.target.round;
        S.target.targetsRequired = Math.min(
          CONFIG.TARGET.MAX_TARGETS_REQUIRED,
          CONFIG.TARGET.TARGETS_REQUIRED_BASE + (level - 1) * CONFIG.TARGET.TARGETS_INCREASE_PER_LEVEL
        );
        S.target.roundDuration = Math.max(
          CONFIG.TARGET.ROUND_DURATION_MIN,
          CONFIG.TARGET.ROUND_DURATION_BASE - (level - 1) * CONFIG.TARGET.ROUND_DURATION_DECREASE
        );
      }

      function showRoundSplash(text, callback) {
        S.target.inTransition = true;
        roundSplash.innerHTML = `<div class="round-text">${text}</div>`;
        roundSplash.classList.add('show');
        setTimeout(() => {
          roundSplash.classList.remove('show');
          S.target.inTransition = false;
          if (callback) callback();
        }, CONFIG.TARGET.ROUND_TRANSITION_MS);
      }

      function startTargetRound() {
        S.target.targetsHit = 0;
        S.target.timeRemaining = S.target.roundDuration;
        updateTargetHUD();
        scheduleNextTarget();
        startRoundTimer();
      }

      function scheduleNextTarget() {
        const level = S.target.round;
        const interval = Math.max(
          CONFIG.TARGET.SPAWN_INTERVAL_MIN,
          CONFIG.TARGET.SPAWN_INTERVAL_BASE - (level - 1) * CONFIG.TARGET.SPAWN_INTERVAL_DECREASE
        );
        const variance = interval * 0.3;
        const delay = interval + (Math.random() - 0.5) * variance;

        S.target.spawnTimer = setTimeout(() => {
          if (S.mode !== 'target' || S.gameOver || S.target.inTransition) return;
          if (S.target.timeRemaining > 0) {
            spawnTarget();
            scheduleNextTarget();
          }
        }, delay);
      }

      function spawnTarget() {
        const maxConcurrent = Math.min(CONFIG.TARGET.MAX_CONCURRENT + Math.floor(S.target.round / 3), 6);
        const activeCount = S.target.active.filter(t => !t.hit && !t.expired).length;
        if (activeCount >= maxConcurrent) return;

        const margin = CONFIG.TARGET.SAFE_MARGIN;
        const x = margin + Math.random() * (window.innerWidth - margin * 2);
        const y = margin + Math.random() * (window.innerHeight - margin * 2);

        const level = S.target.round;
        const baseDuration = CONFIG.TARGET.TARGET_DURATION_BASE - (level - 1) * CONFIG.TARGET.TARGET_DURATION_DECREASE;
        const duration = Math.max(CONFIG.TARGET.TARGET_DURATION_MIN, baseDuration + (Math.random() - 0.5) * 300);

        const el = getPooled(targetPool);
        if (!el) return;

        const target = {
          id: ++targetIdCounter,
          x, y,
          el,
          spawnTime: performance.now(),
          duration,
          hit: false,
          expired: false,
        };

        el.className = 'game-target';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.display = 'block';
        el.innerHTML = `<div class="target-shrink" style="--shrink-duration: ${duration}ms"></div>`;

        S.target.active.push(target);

        // Schedule expiration
        setTimeout(() => expireTarget(target.id), duration);

        // Maybe spawn power-up
        if (S.lives < S.maxLives && Math.random() < CONFIG.POWER_UP.SPAWN_CHANCE) {
          spawnPowerUp('target');
        }
      }

      function expireTarget(targetId) {
        const target = S.target.active.find(t => t.id === targetId);
        if (!target || target.hit || target.expired) return;

        target.expired = true;
        if (target.el) {
          target.el.style.display = 'none';
          release(target.el);
        }
      }

      function hitTarget(x, y) {
        const hitRadius = CONFIG.TARGET.TARGET_RADIUS;
        for (const target of S.target.active) {
          if (target.hit || target.expired) continue;
          const dx = x - target.x;
          const dy = y - target.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist <= hitRadius) {
            target.hit = true;
            S.target.targetsHit++;

            // Visual feedback
            if (target.el) {
              target.el.style.display = 'none';
              release(target.el);
            }
            triggerTargetHitEffect(target.x, target.y);
            playHit(true, S.target.targetsHit);

            updateTargetHUD();

            // Check round completion
            if (S.target.targetsHit >= S.target.targetsRequired) {
              completeTargetRound();
            }
            return true;
          }
        }
        return false;
      }

      function startRoundTimer() {
        S.target.roundTimer = setInterval(() => {
          if (S.mode !== 'target' || S.gameOver) {
            clearInterval(S.target.roundTimer);
            return;
          }
          S.target.timeRemaining -= 100;
          updateTargetHUD();

          if (S.target.timeRemaining <= 0) {
            clearInterval(S.target.roundTimer);
            endTargetRound();
          }
        }, 100);
      }

      function updateTargetHUD() {
        targetRoundNum.textContent = S.target.round;
        targetsHitEl.textContent = S.target.targetsHit;
        targetsRequiredEl.textContent = S.target.targetsRequired;
        timeRemainingEl.textContent = (S.target.timeRemaining / 1000).toFixed(1);
      }

      function completeTargetRound() {
        if (S.target.spawnTimer) clearTimeout(S.target.spawnTimer);
        if (S.target.roundTimer) clearInterval(S.target.roundTimer);

        // Clear remaining targets
        S.target.active.forEach(t => {
          if (t.el && !t.hit) {
            t.el.style.display = 'none';
            release(t.el);
          }
        });
        S.target.active = [];

        // Advance to next round
        S.target.round++;
        calculateTargetRoundParams();
        showRoundSplash(`ROUND ${S.target.round}`, () => startTargetRound());
      }

      function endTargetRound() {
        if (S.target.spawnTimer) clearTimeout(S.target.spawnTimer);

        // Clear remaining targets
        S.target.active.forEach(t => {
          if (t.el) {
            t.el.style.display = 'none';
            release(t.el);
          }
        });
        S.target.active = [];

        // Check if passed
        if (S.target.targetsHit >= S.target.targetsRequired) {
          completeTargetRound();
        } else {
          loseLife();
        }
      }

      function triggerTargetHitEffect(x, y) {
        // Add burst effect
        spawnParticles(x, y, 8, 'var(--color-success)');
      }

      // ===========================================
      // RHYTHM MODE
      // ===========================================
      function initRhythmMode() {
        S.rhythm.bpm = CONFIG.RHYTHM.BPM_BASE;
        S.rhythm.score = 0;
        S.rhythm.streak = 0;
        S.rhythm.bestStreak = 0;
        S.rhythm.missCount = 0;
        S.rhythm.notes = [];
        S.rhythm.level = 1;
        S.rhythm.lastBeat = 0;
        updateRhythmHUD();
        showRoundSplash('GET READY', () => startRhythmBeatLoop());
      }

      function startRhythmBeatLoop() {
        const beatInterval = 60000 / S.rhythm.bpm;
        S.rhythm.beatTimer = setInterval(() => {
          if (S.mode !== 'rhythm' || S.gameOver) {
            clearInterval(S.rhythm.beatTimer);
            return;
          }
          onBeat();
        }, beatInterval);
      }

      function onBeat() {
        S.rhythm.lastBeat = performance.now();
        playBeatSound();
        spawnNote();

        // Check for missed notes
        checkMissedNotes();

        // Maybe spawn power-up
        if (S.lives < S.maxLives && Math.random() < CONFIG.POWER_UP.SPAWN_CHANCE) {
          spawnPowerUp('rhythm');
        }
      }

      function playBeatSound() {
        if (!soundEnabled) return;
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(80, now);
        g.gain.setValueAtTime(0.15, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        o.connect(g); g.connect(ctx.destination);
        o.start(now); o.stop(now + 0.1);
      }

      function spawnNote() {
        const margin = 100;
        const x = margin + Math.random() * (window.innerWidth - margin * 2);
        const y = margin + Math.random() * (window.innerHeight - margin * 2);

        const el = getPooled(targetPool);
        if (!el) return;

        const note = {
          id: ++noteIdCounter,
          x, y,
          el,
          spawnTime: performance.now(),
          hitTime: performance.now() + CONFIG.RHYTHM.NOTE_APPROACH_TIME,
          hit: false,
          expired: false,
        };

        el.className = 'rhythm-note';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.display = 'block';
        el.innerHTML = `<div class="note-approach" style="--approach-time: ${CONFIG.RHYTHM.NOTE_APPROACH_TIME}ms"></div>`;

        S.rhythm.notes.push(note);
      }

      function checkMissedNotes() {
        const now = performance.now();
        for (const note of S.rhythm.notes) {
          if (note.hit || note.expired) continue;
          // Note is missed if we're past the good window
          if (now > note.hitTime + CONFIG.RHYTHM.GOOD_WINDOW) {
            note.expired = true;
            S.rhythm.streak = 0;
            S.rhythm.missCount++;

            if (note.el) {
              note.el.style.display = 'none';
              release(note.el);
            }

            // Show miss feedback
            showHitFeedback(note.x, note.y, 'MISS', 'hit-miss');

            if (S.rhythm.missCount >= CONFIG.RHYTHM.MISS_THRESHOLD) {
              S.rhythm.missCount = 0;
              loseLife();
            }

            updateRhythmHUD();
          }
        }
      }

      function hitNote(x, y) {
        const now = performance.now();
        let closestNote = null;
        let closestDist = Infinity;

        for (const note of S.rhythm.notes) {
          if (note.hit || note.expired) continue;
          const dx = x - note.x;
          const dy = y - note.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist <= CONFIG.RHYTHM.NOTE_RADIUS && dist < closestDist) {
            closestNote = note;
            closestDist = dist;
          }
        }

        if (closestNote) {
          const timing = Math.abs(now - closestNote.hitTime);
          closestNote.hit = true;

          let score, rating, ratingClass;

          if (timing <= CONFIG.RHYTHM.PERFECT_WINDOW) {
            score = CONFIG.RHYTHM.SCORE_PERFECT;
            rating = 'PERFECT';
            ratingClass = 'hit-perfect';
          } else if (timing <= CONFIG.RHYTHM.GOOD_WINDOW) {
            score = CONFIG.RHYTHM.SCORE_GOOD;
            rating = 'GOOD';
            ratingClass = 'hit-good';
          } else {
            score = 0;
            rating = 'MISS';
            ratingClass = 'hit-miss';
            S.rhythm.streak = 0;
          }

          if (rating !== 'MISS') {
            S.rhythm.streak++;
            S.rhythm.bestStreak = Math.max(S.rhythm.bestStreak, S.rhythm.streak);
            score = Math.round(score * (1 + S.rhythm.streak * CONFIG.RHYTHM.STREAK_MULTIPLIER));
            S.rhythm.missCount = 0;

            // Level up every 20 successful hits
            if (S.rhythm.streak > 0 && S.rhythm.streak % 20 === 0) {
              levelUpRhythm();
            }
          }

          S.rhythm.score += score;

          if (closestNote.el) {
            closestNote.el.style.display = 'none';
            release(closestNote.el);
          }

          showHitFeedback(closestNote.x, closestNote.y, rating, ratingClass);
          if (rating !== 'MISS') {
            playHit(rating === 'PERFECT', S.rhythm.streak);
            triggerTargetHitEffect(closestNote.x, closestNote.y);
          }

          updateRhythmHUD();
          return true;
        }
        return false;
      }

      function levelUpRhythm() {
        S.rhythm.level++;
        S.rhythm.bpm = Math.min(CONFIG.RHYTHM.BPM_MAX, S.rhythm.bpm + CONFIG.RHYTHM.BPM_INCREASE);

        // Restart beat loop with new BPM
        if (S.rhythm.beatTimer) clearInterval(S.rhythm.beatTimer);
        startRhythmBeatLoop();

        // Visual feedback
        triggerMilestone(`LEVEL ${S.rhythm.level}`);
        updateRhythmHUD();
      }

      function showHitFeedback(x, y, text, className) {
        const el = getPooled(hitPool);
        if (!el) return;

        el.className = `hit ${className}`;
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.display = 'block';
        el.style.animation = 'none';

        requestAnimationFrame(() => {
          void el.offsetHeight;
          el.style.animation = '';
        });

        setTimeout(() => release(el), 600);
      }

      function updateRhythmHUD() {
        rhythmScoreEl.textContent = S.rhythm.score;
        streakCountEl.textContent = S.rhythm.streak;
        bpmValueEl.textContent = S.rhythm.bpm;
      }

      // ===========================================
      // POWER-UP SYSTEM
      // ===========================================
      function spawnPowerUp(mode) {
        const stateObj = mode === 'target' ? S.target : S.rhythm;
        if (stateObj.powerUp) return; // Only one at a time

        const margin = CONFIG.TARGET.SAFE_MARGIN;
        const x = margin + Math.random() * (window.innerWidth - margin * 2);
        const y = margin + Math.random() * (window.innerHeight - margin * 2);

        const el = getPooled(powerUpPool);
        if (!el) return;

        el.className = 'power-up';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.display = 'block';
        el.innerHTML = '<div class="power-up-heart"></div>';

        stateObj.powerUp = { x, y, el, spawnTime: performance.now() };

        // Auto-expire
        setTimeout(() => {
          if (stateObj.powerUp && stateObj.powerUp.el === el) {
            el.style.display = 'none';
            release(el);
            stateObj.powerUp = null;
          }
        }, CONFIG.POWER_UP.DURATION);
      }

      function hitPowerUp(x, y) {
        const stateObj = S.mode === 'target' ? S.target : S.rhythm;
        if (!stateObj.powerUp) return false;

        const dx = x - stateObj.powerUp.x;
        const dy = y - stateObj.powerUp.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= CONFIG.POWER_UP.RADIUS) {
          gainLife();
          spawnParticles(stateObj.powerUp.x, stateObj.powerUp.y, 10, 'var(--color-success)');
          stateObj.powerUp.el.style.display = 'none';
          release(stateObj.powerUp.el);
          stateObj.powerUp = null;
          return true;
        }
        return false;
      }

      // ===========================================

      function triggerGameOver() {
        S.gameOver = true;

        if (S.mode === 'target') {
          scoreText = `Reached Round ${S.target.round}`;
          bestKey = 'clickdps-best-target';
        } else if (S.mode === 'rhythm') {
          scoreText = `Score: ${S.rhythm.score}`;
          bestKey = 'clickdps-best-rhythm';
        }

        const currentBest = parseInt(safeGetItem(bestKey, '0'));
        const newScore = S.mode === 'target' ? S.target.round : S.rhythm.score;
        const isNewBest = newScore > currentBest;

        if (isNewBest) {
          safeSetItem(bestKey, newScore);
        }

        gameOverScore.textContent = scoreText;
        gameOverBest.textContent = isNewBest ? 'NEW BEST!' : `Best: ${Math.max(currentBest, newScore)}`;

      // ===========================================
      // OBJECT POOLS (Optimized with free list for O(1) lookup)
      // ===========================================
      const POOL_SIZE = 30;
      const PARTICLE_POOL_SIZE = 50;
      const TRAIL_POOL_SIZE = 20;

      // Pool structure with free list
      function createPool(size, poolType, createElement) {
        const elements = [];
        const freeList = [];
        const inUse = new Set(); // Track which indices are in use
        for (let i = 0; i < size; i++) {
          const el = createElement();
          el._poolIndex = i;
          el._poolType = poolType;
          elements.push(el);
          freeList.push(i);
        }
        return { elements, freeList, inUse };
      }

      const hitPool = createPool(POOL_SIZE, 'hit', () => {
        const hit = document.createElement('div');
        hit.className = 'hit norm';
        hit.style.display = 'none';
        shakeContainer.appendChild(hit);
        return hit;
      });

      const ringPool = createPool(POOL_SIZE, 'ring', () => {
        const ring = document.createElement('div');
        ring.className = 'ring';
        ring.style.display = 'none';
        shakeContainer.appendChild(ring);
        return ring;
      });

      const particlePool = createPool(PARTICLE_POOL_SIZE, 'particle', () => {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.display = 'none';

        return particle;
      });

      const trailPool = createPool(TRAIL_POOL_SIZE, 'trail', () => {
        const trail = document.createElement('div');

        trail.style.display = 'none';
        shakeContainer.appendChild(trail);
        return trail;
      });

      // Target pool for target mode

      const targetPool = createPool(TARGET_POOL_SIZE, 'target', () => {
        const target = document.createElement('div');
        target.className = 'game-target';
