<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <title>CLICKDPS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      body {
        background: #000;
        color: #fff;
        font-family: 'Courier New', monospace;
        cursor: crosshair;
        user-select: none;
        position: fixed;
        width: 100%;
      }

      /* Grid background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(#111 1px, transparent 1px),
          linear-gradient(90deg, #111 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.5;
        pointer-events: none;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        mix-blend-mode: difference;
      }

      #dps-num {
        font-size: clamp(64px, 20vw, 200px);
        font-weight: 900;
        line-height: 0.8;
        letter-spacing: -0.06em;
        color: #fff;
        text-shadow:
          4px 4px 0 #ff0040,
          -2px -2px 0 #00ff88;
      }

      #label {
        font-size: 10px;
        letter-spacing: 0.4em;
        color: #444;
        text-transform: uppercase;
        margin-top: 8px;
      }

      #combo {
        display: inline-block;
        font-size: clamp(18px, 5vw, 32px);
        font-weight: 900;
        color: #ff0040;
        opacity: 0;
        transition: opacity 0.1s;
        margin-left: 12px;
        vertical-align: bottom;
      }

      #best {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
      }

      #best-label {
        font-size: 10px;
        letter-spacing: 0.2em;
        color: #444;
        text-transform: uppercase;
      }

      #best-value {
        font-size: 22px;
        font-weight: 900;
        color: #00ff88;
        letter-spacing: -0.02em;
      }

      #new-best {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        letter-spacing: 0.3em;
        color: #00ff88;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        z-index: 60;
      }

      #new-best.show {
        animation: new-best-anim 1.5s ease-out forwards;
      }

      @keyframes new-best-anim {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -80%) scale(1.2); }
      }

      #combo.visible {
        opacity: 1;
      }

      #bar-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 200;
      }

      #bar-label {
        position: absolute;
        bottom: 6px;
        left: 16px;
        font-size: 8px;
        letter-spacing: 0.15em;
        color: #222;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.2s;
      }

      #bar-container:hover #bar-label {
        opacity: 1;
      }

      #bar {
        width: 100%;
        height: 4px;
        background: #111;
      }

      #bar-fill {
        height: 100%;
        width: 0%;
        background: #fff;
        transition: width 0.05s linear;
      }

      #stats {
        position: fixed;
        top: 16px;
        right: 16px;
        text-align: right;
        font-size: 14px;
        line-height: 1.9;
        color: #555;
        z-index: 100;
      }

      #stats span {
        color: #777;
      }

      /* Damage popups */
      .hit {
        position: absolute;
        font-weight: 900;
        pointer-events: none;
        z-index: 60;
        animation: pop 0.5s ease-out forwards;
      }

      .hit.norm {
        font-size: 28px;
        color: #fff;
      }

      .hit.crit {
        font-size: 48px;
        color: #ff0040;
        text-shadow: 0 0 20px #ff0040;
        animation: pop-crit 0.7s ease-out forwards;
      }

      @keyframes pop {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-60px) scale(0.7);
        }
      }

      @keyframes pop-crit {
        0% {
          opacity: 1;
          transform: translateY(0) scale(0.5) rotate(-5deg);
        }
        20% {
          transform: translateY(-10px) scale(1.3) rotate(5deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-100px) scale(0.8) rotate(-3deg);
        }
      }

      /* Impact ring */
      .ring {
        position: absolute;
        width: 80px;
        height: 80px;
        border: 2px solid #fff;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0);
        animation: ring-out 0.3s ease-out forwards;
      }

      @keyframes ring-out {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0.6;
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }
      }

      /* Crit flash */
      #flash {
        position: fixed;
        inset: 0;
        background: #ff0040;
        opacity: 0;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: overlay;
      }

      #flash.on {
        animation: flash 0.08s ease-out;
      }

      @keyframes flash {
        0% { opacity: 0.4; }
        100% { opacity: 0; }
      }

      /* Corner decorations */
      .corner {
        position: fixed;
        width: 30px;
        height: 30px;
        border: 2px solid #222;
        pointer-events: none;
        z-index: 10;
      }
      .corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
      .corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
      .corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
      .corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

      #hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: #222;
        text-transform: uppercase;
        transition: opacity 0.5s ease-out;
      }

      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .bottom-btn {
        position: fixed;
        bottom: 16px;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: #333;
        background: none;
        border: 1px solid #222;
        padding: 6px 10px;
        cursor: pointer;
        text-transform: uppercase;
        z-index: 100;
        transition: color 0.1s, border-color 0.1s;
      }

      .bottom-btn:hover {
        color: #555;
        border-color: #444;
      }

      #sound-toggle {
        right: 16px;
      }

      #sound-toggle.on {
        color: #00ff88;
        border-color: #00ff88;
      }

      #reset-btn {
        right: 110px;
      }

      #reset-btn:hover {
        color: #ff0040;
        border-color: #ff0040;
      }
    </style>
  </head>

  <body>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="flash"></div>

    <div id="hud">
      <div><span id="dps-num" data-value="0">0</span><span id="combo"></span></div>
      <div id="label">dmg/sec</div>
    </div>

    <div id="best">
      <div id="best-label">High Score</div>
      <div id="best-value">0</div>
    </div>

    <div id="new-best">New Record!</div>

    <div id="stats">
      <span>CLICKS</span> <span id="s-hits">0</span><br>
      <span>TOTAL DMG</span> <span id="s-dmg">0</span>
    </div>

    <div id="bar-container">
      <div id="bar-label">intensity</div>
      <div id="bar"><div id="bar-fill"></div></div>
    </div>

    <div id="hint">click to destroy</div>

    <button id="reset-btn" class="bottom-btn">reset</button>
    <button id="sound-toggle" class="bottom-btn">sound: off</button>

    <script>
      // ===========================================
      // GAME CONFIGURATION
      // ===========================================
      const CONFIG = {
        // Damage
        BASE_DAMAGE: 10,              // Base damage per click
        CRIT_MULTIPLIER: 3,           // Damage multiplier on critical hit
        COMBO_DAMAGE_BONUS: 0.04,     // Extra damage multiplier per combo (e.g., 0.04 = +4% per combo)

        // Combo system
        COMBO_WINDOW_MS: 300,         // Max ms between clicks to maintain/build combo
        COMBO_DECAY_MS: 400,          // Ms of no clicks before combo starts decaying
        MAX_COMBO: 99,                // Maximum combo multiplier

        // Critical hits
        BASE_CRIT_CHANCE: 0.12,       // Base chance to crit (12%)
        CRIT_CHANCE_PER_COMBO: 0.008, // Additional crit chance per combo point

        // Timing
        DPS_WINDOW_MS: 1000,          // Window for calculating DPS
        TICK_INTERVAL_MS: 50,         // Game loop interval

        // UI
        INTENSITY_BAR_MAX_HITS: 10,   // Hits needed to fill intensity bar
      };

      const S = {
        base: CONFIG.BASE_DAMAGE,
        combo: 0,
        last: 0,
        log: [],
        hits: 0,
        dmg: 0,
        crits: 0,
        best: parseInt(localStorage.getItem('clickdps-best') || '0')
      };

      const $ = id => document.getElementById(id);
      const dps = $('dps-num');
      const combo = $('combo');
      const flash = $('flash');
      const bar = $('bar-fill');
      const bestEl = $('best-value');
      const newBestEl = $('new-best');
      const hint = $('hint');

      // Initialize best display
      bestEl.textContent = S.best;

      // Object pools for DOM elements
      const hitPool = [];
      const ringPool = [];
      const POOL_SIZE = 30;

      // Pre-create pooled elements
      for (let i = 0; i < POOL_SIZE; i++) {
        const hit = document.createElement('div');
        hit.className = 'hit norm';
        hit.style.display = 'none';
        document.body.appendChild(hit);
        hitPool.push(hit);

        const ring = document.createElement('div');
        ring.className = 'ring';
        ring.style.display = 'none';
        document.body.appendChild(ring);
        ringPool.push(ring);
      }

      function getPooledHit() {
        for (const el of hitPool) {
          if (el.style.display === 'none') return el;
        }
        return hitPool[0]; // Reuse oldest if all in use
      }

      function getPooledRing() {
        for (const el of ringPool) {
          if (el.style.display === 'none') return el;
        }
        return ringPool[0]; // Reuse oldest if all in use
      }

      function releaseHit(el) {
        el.style.display = 'none';
        el.classList.remove('crit', 'norm');
      }

      function releaseRing(el) {
        el.style.display = 'none';
      }

      // Audio system
      let audioCtx = null;
      let soundEnabled = false;
      const soundToggle = $('sound-toggle');

      function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }

      function toggleSound(e) {
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        soundToggle.textContent = 'sound: ' + (soundEnabled ? 'on' : 'off');
        soundToggle.classList.toggle('on', soundEnabled);

        // Initialize/resume AudioContext on user gesture (required for mobile)
        if (soundEnabled) {
          const ctx = getAudioCtx();
          if (ctx.state === 'suspended') ctx.resume();
        }
      }

      soundToggle.addEventListener('click', toggleSound);

      // Reset functionality
      const resetBtn = $('reset-btn');

      function resetGame(e) {
        e.stopPropagation();
        if (!confirm('Reset all stats and high score?')) return;

        S.combo = 0;
        S.last = 0;
        S.log = [];
        S.hits = 0;
        S.dmg = 0;
        S.crits = 0;
        S.best = 0;
        localStorage.removeItem('clickdps-best');
        bestEl.textContent = '0';
        hint.classList.remove('hidden');
        render();
      }

      resetBtn.addEventListener('click', resetGame);

      function playHit(crit, combo) {
        if (!soundEnabled) return;
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        // Create oscillator
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        if (crit) {
          // Crit: punchy low hit with distortion feel
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(80 + Math.random() * 20, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, now);
          filter.frequency.exponentialRampToValueAtTime(100, now + 0.1);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else {
          // Normal: quick snappy tick, pitch increases with combo
          const baseFreq = 400 + combo * 8 + Math.random() * 50;
          osc.type = 'square';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.05);
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(200, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      }

      function smash(x, y) {
        const now = performance.now();

        // Hide hint on first click
        if (S.hits === 0) hint.classList.add('hidden');

        // Combo
        S.combo = (now - S.last < CONFIG.COMBO_WINDOW_MS) ? Math.min(S.combo + 1, CONFIG.MAX_COMBO) : 0;
        S.last = now;

        // Crit
        const crit = Math.random() < (CONFIG.BASE_CRIT_CHANCE + S.combo * CONFIG.CRIT_CHANCE_PER_COMBO);

        // Damage
        const mult = 1 + S.combo * CONFIG.COMBO_DAMAGE_BONUS;
        const d = Math.round(S.base * mult * (crit ? CONFIG.CRIT_MULTIPLIER : 1));

        // Stats
        S.hits++;
        S.dmg += d;
        if (crit) S.crits++;

        // Sound
        playHit(crit, S.combo);

        // Popup (using object pool)
        const el = getPooledHit();
        el.className = `hit ${crit ? 'crit' : 'norm'}`;
        el.textContent = d;
        el.style.left = (x + (Math.random() - 0.5) * 20) + 'px';
        el.style.top = (y - 10) + 'px';
        el.style.display = 'block';
        el.style.animation = 'none';
        el.offsetHeight; // Trigger reflow
        el.style.animation = '';
        setTimeout(() => releaseHit(el), crit ? 700 : 500);

        // Ring (using object pool)
        const ring = getPooledRing();
        ring.style.left = x + 'px';
        ring.style.top = y + 'px';
        ring.style.display = 'block';
        ring.style.animation = 'none';
        ring.offsetHeight; // Trigger reflow
        ring.style.animation = '';
        setTimeout(() => releaseRing(ring), 300);

        // Crit flash
        if (crit) {
          flash.classList.remove('on');
          void flash.offsetWidth;
          flash.classList.add('on');
        }

        // Log
        S.log.push({ t: now, d });

        render();
      }

      function render() {
        const now = performance.now();
        S.log = S.log.filter(e => e.t > now - CONFIG.DPS_WINDOW_MS);

        const total = S.log.reduce((a, e) => a + e.d, 0);
        dps.textContent = total;
        dps.dataset.value = total;

        // Check for new best
        if (total > S.best) {
          S.best = total;
          localStorage.setItem('clickdps-best', S.best);
          bestEl.textContent = S.best;

          // Show new record notification
          newBestEl.classList.remove('show');
          void newBestEl.offsetWidth;
          newBestEl.classList.add('show');
        }

        // Combo display
        if (S.combo > 3) {
          combo.textContent = S.combo + 'x';
          combo.classList.add('visible');
        } else {
          combo.classList.remove('visible');
        }

        // Intensity bar
        const int = Math.min(S.log.length / CONFIG.INTENSITY_BAR_MAX_HITS, 1);
        bar.style.width = (int * 100) + '%';

        // Stats
        $('s-hits').textContent = S.hits;
        $('s-dmg').textContent = S.dmg.toLocaleString();
      }

      function tick() {
        if (performance.now() - S.last > CONFIG.COMBO_DECAY_MS && S.combo > 0) {
          S.combo = Math.max(0, S.combo - 1);
        }
        render();
      }

      document.addEventListener('click', e => {
        if (e.target === soundToggle || e.target === resetBtn) return;
        smash(e.clientX, e.clientY);
      });
      document.addEventListener('touchstart', e => {
        // Allow buttons to work normally
        if (e.target === soundToggle || e.target === resetBtn) return;
        e.preventDefault();
        for (const t of e.touches) smash(t.clientX, t.clientY);
      }, { passive: false });

      // Game loop with visibility handling
      let tickInterval = setInterval(tick, CONFIG.TICK_INTERVAL_MS);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearInterval(tickInterval);
          tickInterval = null;
        } else {
          // Reset timing state when returning to prevent stale data
          S.log = [];
          S.last = 0;
          S.combo = 0;
          if (!tickInterval) tickInterval = setInterval(tick, CONFIG.TICK_INTERVAL_MS);
          render();
        }
      });
    </script>
  </body>
</html>
