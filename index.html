<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <title>ClickDPS</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      body {
        background: #1a1a1a;
        color: white;
        font-family: Arial, sans-serif;
        cursor: crosshair;
        user-select: none;
        position: fixed;
        width: 100%;
      }

      #dps-display {
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #4ecdc4;
        text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        z-index: 1000;
      }

      #instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #666;
        text-align: center;
      }

      @keyframes fadeFloat {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-50px) scale(1.1);
        }
      }
    </style>
  </head>

  <body>
    <div id="dps-display">DPS: 0</div>
    <div id="instructions">Click anywhere to deal damage</div>
    <script>
      let baseDamage = 10;
      let clickHistory = []; // Store {timestamp, damage}

      function dealDamage(x, y) {
        // Create damage number element
        const damageEl = document.createElement("div");
        damageEl.textContent = baseDamage;
        damageEl.style.position = "absolute";
        damageEl.style.left = x + "px";
        damageEl.style.top = y + "px";
        damageEl.style.color = "#ff6b6b";
        damageEl.style.fontWeight = "bold";
        damageEl.style.pointerEvents = "none";
        damageEl.style.animation = "fadeFloat 1s ease-out forwards";

        document.body.appendChild(damageEl);

        // Remove element after animation completes
        setTimeout(() => {
          damageEl.remove();
        }, 1000);

        // Record click for DPS
        clickHistory.push({
          timestamp: performance.now(),
          damage: baseDamage,
        });
      }

      // Handle mouse clicks
      document.addEventListener("click", (e) => {
        dealDamage(e.clientX, e.clientY);
      });

      // Handle touch events for mobile
      document.addEventListener("touchstart", (e) => {
        e.preventDefault();
        for (const touch of e.touches) {
          dealDamage(touch.clientX, touch.clientY);
        }
      }, { passive: false });

      function calculateDPS() {
        const now = performance.now();
        const oneSecondAgo = now - 1000;

        // Keep only clicks from the last second
        clickHistory = clickHistory.filter(
          (click) => click.timestamp > oneSecondAgo,
        );

        // Calculate total damage in the last second
        const recentDamage = clickHistory.reduce(
          (sum, click) => sum + click.damage,
          0,
        );

        // Update display
        const dpsElement = document.getElementById("dps-display");
        if (dpsElement) {
          dpsElement.textContent = `DPS: ${recentDamage}`;
        }
      }
      // Update DPS every 100ms for smooth updates
      setInterval(calculateDPS, 100);
    </script>
  </body>
</html>
